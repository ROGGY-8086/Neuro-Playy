version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cognitive-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: cognitive_platform
      MYSQL_USER: cognitive_user
      MYSQL_PASSWORD: cognitive_secure_password_replace_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
