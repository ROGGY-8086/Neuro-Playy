server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: cognitive-platform-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:4000}/${DB_NAME:test}?createDatabaseIfNotExist=${DB_CREATE_IF_NOT_EXISTS:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&enabledTLSProtocols=${DB_TLS_PROTOCOLS:TLSv1.2,TLSv1.3}}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      initialization-fail-timeout: 20000
      validation-timeout: 5000
      max-lifetime: 1800000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

# Application specific configurations
app:
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
  jwt:
    # 256-bit secret key in base64 format
    secret: ${JWT_SECRET:c3VwZXJzZWNyZXRqd3RrZXlmaXJzdGNvZ25pdGl2ZXBsYXRmb3JtMjAyNmZvcm1lbW9yeQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://neuro-playy.vercel.app,https://capstone-liart-pi.vercel.app}
  storage:
    upload-dir: ${UPLOAD_DIR:/tmp/uploads/media}
    max-image-size-bytes: 5242880 # 5 MB
    max-audio-size-bytes: 10485760 # 10 MB
  difficulty:
    min-sessions-for-suggestion: 5
    high-completion-hint-threshold: 2
    low-completion-rate-threshold: 0.6
  rate-limiting:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: 60

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    com.zaxxer.hikari: DEBUG
    org.flywaydb: DEBUG
    com.cognitiveplatform: DEBUG
