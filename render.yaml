services:
  - type: web
    name: neuro-playy-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: true
    healthCheckPath: /api-docs
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://capstone-liart-pi.vercel.app,https://neuro-playy.vercel.app
      - key: JWT_SECRET
        value: c3VwZXJzZWNyZXRqd3RrZXlmaXJzdGNvZ25pdGl2ZXBsYXRmb3JtMjAyNmZvcm1lbW9yeQ==
